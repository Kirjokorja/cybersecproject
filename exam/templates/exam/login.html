<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <form action="/register-user/" method="GET">
      <input type="submit" value="Register"/>
    </form>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <h2>Login</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Login</button>
    </form>
  </body>
</html>
