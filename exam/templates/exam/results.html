<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Result</title>
  </head>
  <body>
    <p>You are logged in as {{user.username}}.</p>
    <form action="/logout/"  method="POST">
		    {% csrf_token %}
        <input type="submit" value="Logout"/>
    </form>

    <h1>{{ exam_results.name_text }}</h1>

    <ul>
        <li>Participant: {{ exam_results.participant }}</li>
        <li>Points: {{ exam_results.points }}</li>
    </ul>

    <a href="{% url 'exam:index' %}">Home</a>
  </body>
</html>
