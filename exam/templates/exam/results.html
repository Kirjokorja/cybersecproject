<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Result</title>
  </head>
  <body>
    <p>You are logged in as {{user.username}}.</p>
    <form action="/logout/"  method="POST">
		    {% csrf_token %}
        <input type="submit" value="Logout"/>
    </form>

    <h1>{{ exam_name }}</h1>
    <p>Participant: {{ participant }}</p>
    <p>Points: {{ points }}</p>
    <ul class="questions">
        {% for q in questions %}
        <li>{{ q.text }}: {{q.answer}}</li>
        {% endfor %}
    </ul>

    <a href="{% url 'exam:index' %}">Home</a>
  </body>
</html>
