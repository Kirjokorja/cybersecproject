<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Registration</title>
  </head>
  <body>
    <h2>Create user</h2>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <form action="/register-user/" method="POST">
      {{ form.as_p }}
      <button type="submit">Register</button>
    </form>
  </body>
</html>
