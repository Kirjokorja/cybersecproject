<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Registration</title>
  </head>
  <body>
    <h2>Create user</h2>
    <form action="/register/" method="POST">
      <p>
        Username: <br />
        <input type="text" name="username" />
      </p>
      <p>
        Password: <br />
        <input type="password" name="password" />
      </p>
      <p>
        Confirm password: <br />
        <input type="password" name="password_confirm" />
      </p>
      <button type="submit">Create</button>
    </form>
  </body>
</html>
